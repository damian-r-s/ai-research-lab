# Hardware- and environment-independent defaults. Never put secrets here.
# Per-environment overrides: config/environments/<LAB_ENV>.toml

[logging]
level = "INFO"
format = "json"

[auth]
session_ttl_hours = 12
max_failures = 5
failure_window_minutes = 15

[resources]
sample_interval_s = 5.0
memory_warn_percent = 90
disk_warn_percent = 90
expect_gpu = false   # set true in an environment file once a GPU is installed
