# FastAPI backend. The `migrate` init container applies Alembic migrations as the schema owner.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: localhost/ai-lab-api
          imagePullPolicy: Never
          command: [python, -m, scripts.migrate, upgrade]
          envFrom:
            - configMapRef: { name: lab-env }  # LAB_ENV etc., generated per overlay
          volumeMounts:
            # Its own secret set: the checkpointer role is needed for migrations only, never by the api.
            - { name: migrate-secrets, mountPath: /run/secrets/lab, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      containers:
        - name: api
          image: localhost/ai-lab-api
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: lab-env }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/lab, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            # Read-only view of the lab data volume, only so the status page can report its usage.
            - { name: lab-volume, mountPath: /host/srv/ai-lab, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 768Mi }
      volumes:
        - name: secrets
          secret:
            secretName: lab-secrets
            defaultMode: 0440
            items:
              - { key: database__url, path: database__url }
              - { key: database__migration_url, path: database__migration_url }
        - name: migrate-secrets
          secret:
            secretName: lab-secrets
            defaultMode: 0440
            items:
              - { key: database__url, path: database__url }
              - { key: database__migration_url, path: database__migration_url }
              - { key: database__graph_url, path: database__graph_url }
        - { name: tmp, emptyDir: {} }
        - name: lab-volume
          hostPath: { path: /srv/ai-lab, type: Directory }
