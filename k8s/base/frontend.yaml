# Dashboard: unprivileged nginx serving the build and proxying /api to the api Service.
# Reached only through `tailscale serve` on the host, via a pinned ClusterIP (set per overlay).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  type: ClusterIP
  clusterIP: CLUSTER_IP_PLACEHOLDER
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: localhost/ai-lab-frontend
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: LAB_API_UPSTREAM, value: "http://api:8000" }
          volumeMounts:
            # nginx renders its config at start and needs a few writable paths.
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
