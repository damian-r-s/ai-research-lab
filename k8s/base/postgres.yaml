# Lab-owned PostgreSQL 17 + pgvector. Never shared with the other project.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Runs once, on first initialisation of an empty data directory.
  10-lab-roles.sh: |
    #!/bin/bash
    set -euo pipefail
    owner_pw="$(cat /run/secrets/pg/owner-password)"
    app_pw="$(cat /run/secrets/pg/app-password)"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
         -v owner_pw="$owner_pw" -v app_pw="$app_pw" <<'SQL'
    CREATE ROLE lab_owner LOGIN PASSWORD :'owner_pw';
    CREATE ROLE lab_app LOGIN PASSWORD :'app_pw';
    GRANT CREATE ON DATABASE lab TO lab_owner;
    GRANT CONNECT ON DATABASE lab TO lab_app;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:0.8.7-pg17-trixie
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: lab }
            - { name: POSTGRES_USER, value: lab_admin }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/pg/superuser-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TZ, value: UTC }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/pg, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, lab_admin, -d, lab] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, lab_admin, -d, lab] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0555 }
        - name: secrets
          secret:
            secretName: lab-secrets
            defaultMode: 0440
            items:
              - { key: superuser-password, path: superuser-password }
              - { key: owner-password, path: owner-password }
              - { key: app-password, path: app-password }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ai-lab-local
        resources:
          requests: { storage: 10Gi }
