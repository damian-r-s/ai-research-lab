# Upper bound for everything in this namespace, so the lab can never starve the other project.
# Values are set per overlay from SERVER_ASSESSMENT §4.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "20"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
# Defaults for any container that forgets to declare resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      max: { memory: 8Gi }
