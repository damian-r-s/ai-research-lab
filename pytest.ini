[pytest]
pythonpath = .
testpaths = test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers
markers =
    integration: needs a running PostgreSQL (local cluster from scripts/dev-db.sh)
    spike: Phase 2a evaluation spike (ARCHITECTURE §16 assumptions)
